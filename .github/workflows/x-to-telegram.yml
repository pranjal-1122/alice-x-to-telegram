name: X to Telegram

on:
  workflow_dispatch:

concurrency:
  group: x-to-telegram-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-x:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Check X and post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          KIXLY_X_USERNAME: ${{ secrets.KIXLY_X_USERNAME }}
        run: python bot.py

      - name: Save latest tweet state
        if: always()
        run: |
          if [ -f last_tweet.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_tweet.json
            git diff --cached --quiet || git commit -m "Update last X post"
            git push
          fi
